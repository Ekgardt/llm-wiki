[project]
name = "llm-wiki"
version = "5.0.0"
requires-python = ">=3.10"
dependencies = [
    "defusedxml==0.7.1",
    "mcp>=1.29,<2",
    # The canonical frontmatter reader (corpus_snapshot) needs it on every install. See
    # docs/research/2026-09-14-a-base-install-can-search.md.
    "pyyaml>=6.0.3,<7",
    "tomli>=2.4.1,<3; python_version < '3.11'",
]

# Optional heavy dependencies — install via `uv sync --extra <name>`.
[project.optional-dependencies]
lexical-benchmark = ["jieba==0.42.1"]
retrieval-benchmark = [
    "sentence-transformers>=5.1,<6",
    "usearch==2.26.0",
    "jieba==0.42.1",
]
# The E5 encoder through ONNX Runtime, without torch (2026-09-25; see
# docs/research/2026-09-25-the-encoder-runs-without-torch.md).
semantic = [
    "huggingface-hub>=0.34,<2",
    "numpy>=2.2.6,<3",
    "onnxruntime>=1.18,<1.24; python_version < '3.11'",
    "onnxruntime>=1.18,<2; python_version >= '3.11'",
    "tokenizers>=0.19,<1",
]
# Search as documented: the encoder and the reranker, which is on by default
# (docs/research/2026-09-25-an-update-brings-the-extras-the-operator-chose.md).
hybrid = ["numpy>=2.2.6,<3", "llm-wiki[semantic,reranker]"]
# v4.0: tree-sitter code graph (12 languages; grammars remain optional as a group).
code-graph = [
    "jedi>=0.19,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-ruby>=0.23,<1",
    "tree-sitter-php>=0.23,<1",
    "tree-sitter-c-sharp>=0.23,<1",
    "tree-sitter-bash>=0.23,<1",
]
# v4.0: MCP server (12 task-shaped tools, stdio transport, 100% local).
mcp-server = []
# Cross-encoder reranker (bge-reranker-v2-m3 through transformers on torch,
# local CPU, int8 dynamic quantisation).
reranker = [
    "tokenizers>=0.19,<1",
    "torch>=2.2,<3",
    "transformers>=4.44,<6",
]
# Convenience: install everything.
full = [
    "llm-wiki[semantic,hybrid,code-graph,mcp-server,reranker]",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "numpy>=2.2.6,<3",
    "jedi>=0.19,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-ruby>=0.23,<1",
    "tree-sitter-php>=0.23,<1",
    "tree-sitter-c-sharp>=0.23,<1",
    "tree-sitter-bash>=0.23,<1",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.6.0",
    "lizard==1.23.0",
]
# Not installed by default: CI syncs it alone to audit the lock for known
# vulnerabilities (docs/research/2026-09-27-the-lock-is-audited.md).
audit = [
    "pip-audit>=2.10.1,<3",
]

[tool.uv]
required-version = "==0.12.3"

# The reranker runs torch on the CPU; PyPI's Linux torch carries CUDA (about 800 MB
# of nvidia-* wheels), so Linux takes PyTorch's CPU build. Explicit: this index
# serves torch and nothing else. Windows and macOS builds on PyPI are already CPU.
# See docs/research/2026-09-29-every-install-brings-every-component.md.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `conftest.py` injects scripts/ into sys.path; no package install needed.
pythonpath = ["scripts"]
# A test still running after this many seconds has every thread's stack dumped to the
# log, so a hang names itself instead of silently burning the CI job until it is
# cancelled (run 36312497314 lost 48 minutes on one hung test and named nothing).
# Basis: the slowest legitimate test of the last green main run (36260843078: 88 470
# test cases in 36 jobs) took 384.9 s; 600 s is about 1.5 times that and well inside the
# 60-minute Windows job limit. Raise it if a legitimate test ever needs longer.
# docs/research/2026-09-27-a-reader-is-cancelled-until-it-leaves.md
faulthandler_timeout = 600

[tool.pyright]
# Declared so Pyright never searches ancestor directories for its settings.
# Without this the navigation engine refuses to qualify against this
# repository, because an analysis that reads configuration from outside the
# checkout is not reproducible.
include = ["scripts", "tests", "benchmark"]
typeCheckingMode = "basic"

[tool.ruff]
extend-exclude = ["tests/fixtures/code_kernel/python/pkg/broken.py"]
force-exclude = true
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports), E/W = pycodestyle,
# I = isort (import order), UP = pyupgrade (modern syntax).
select = ["F", "E", "W", "I", "UP"]
# Docstring-heavy scripts legitimately have long lines in inline examples.
ignore = ["E501"]
