[project]
name = "llm-wiki"
version = "4.0.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29,<2",
    "tomli>=2.4.1,<3; python_version < '3.11'",
]

# Optional heavy dependencies — install via `uv sync --extra <name>`.
[project.optional-dependencies]
lexical-benchmark = ["jieba==0.42.1"]
retrieval-benchmark = [
    "sentence-transformers>=5.1,<6",
    "usearch==2.26.0",
    "jieba==0.42.1",
]
semantic = ["sentence-transformers>=2.7,<6"]
hybrid = ["numpy>=2.2.6,<3", "lancedb>=0.20", "sentence-transformers>=2.7,<6"]
cognee = ["cognee>=0.1,<2"]
# v4.0: tree-sitter code graph (12 languages; grammars remain optional as a group).
code-graph = [
    "jedi>=0.19,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-ruby>=0.23,<1",
    "tree-sitter-php>=0.23,<1",
    "tree-sitter-c-sharp>=0.23,<1",
    "tree-sitter-bash>=0.23,<1",
]
# v4.0: MCP server (12 task-shaped tools, stdio transport, 100% local).
mcp-server = []
# v4.0: Cross-encoder reranker (mxbai-rerank via ONNX, local CPU).
reranker = [
    "onnxruntime>=1.18,<1.24; python_version < '3.11'",
    "onnxruntime>=1.18,<2; python_version >= '3.11'",
    "optimum>=1.20,<2",
    "tokenizers>=0.19,<1",
    "torch>=2.2,<3",
    "transformers>=4.44,<6",
]
# Convenience: install everything.
full = [
    "llm-wiki[semantic,hybrid,code-graph,mcp-server,reranker]",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "numpy>=2.2.6,<3",
    "jedi>=0.19,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-ruby>=0.23,<1",
    "tree-sitter-php>=0.23,<1",
    "tree-sitter-c-sharp>=0.23,<1",
    "tree-sitter-bash>=0.23,<1",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.6.0",
]

[tool.uv]
required-version = "==0.12.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `conftest.py` injects scripts/ into sys.path; no package install needed.
pythonpath = ["scripts"]

[tool.ruff]
extend-exclude = ["tests/fixtures/code_kernel/python/pkg/broken.py"]
force-exclude = true
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports), E/W = pycodestyle,
# I = isort (import order), UP = pyupgrade (modern syntax).
select = ["F", "E", "W", "I", "UP"]
# Docstring-heavy scripts legitimately have long lines in inline examples.
ignore = ["E501"]
