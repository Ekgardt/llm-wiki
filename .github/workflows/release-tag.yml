name: release-tag

# Tags the version a green `main` commit declares, once. The tag used to be a
# manual step after the merge, and 4.0.0 → 5.0.0 went a month untagged while the
# READMEs already named the next tag. See
# docs/research/2026-09-24-a-green-main-tags-its-version.md.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Two green pushes in a row must not race for the same tag.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag the declared version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The existing tags decide whether this version is already released.
          fetch-depth: 0
          fetch-tags: true
      - name: Tag the version the commit declares
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release_tag.py --commit "$HEAD_SHA" --push
