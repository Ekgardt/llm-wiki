name: temporary Windows SQLite diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LLM_WIKI_ROOT: ${{ github.workspace }}
      LLM_WIKI_STATE_ROOT: ${{ github.workspace }}/../llm-wiki-diagnostic-state
      LLM_WIKI_TEST_USE_EXTERNAL_STATE: "1"
      MEMORY_LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.12.3"
      - run: uv sync --locked --python 3.12
      - name: Normalize external state root
        shell: bash
        run: >
          uv run --locked --no-sync python -c
          "import os, pathlib; print('LLM_WIKI_STATE_ROOT=' + str(pathlib.Path(os.environ['LLM_WIKI_STATE_ROOT']).resolve()))"
          >> "$GITHUB_ENV"
      - name: Original uninstrumented regression
        run: uv run --locked --no-sync python -m pytest tests/test_retrieval_telemetry.py::test_concurrent_process_writers_do_not_lose_events -q --durations=0
      - name: Same eight writers with in-memory SQL timing
        if: always()
        shell: bash
        run: |
          uv run --locked --no-sync python - <<'PY'
          import json
          import os
          import sqlite3
          import subprocess
          import sys
          from contextlib import ExitStack
          from pathlib import Path

          root = Path.cwd()
          sys.path[:0] = [str(root / 'scripts'), str(root)]
          from retrieval_telemetry import read_events
          from tests.slow_machine import SHORT_TIMEOUT

          output = Path(os.environ['RUNNER_TEMP']) / 'sqlite-diagnostic'
          output.mkdir()
          child = output / 'writer.py'
          child.write_text("import json\nimport sqlite3\nimport sys\nimport time\nfrom pathlib import Path\n\nimport retrieval_telemetry as telemetry\n\nrecords = []\nconnect = sqlite3.connect\n\n\ndef measured(label, function, *args, **kwargs):\n    started = time.perf_counter()\n    error = None\n    try:\n        return function(*args, **kwargs)\n    except BaseException as exc:\n        error = {'type': type(exc).__name__, 'code': getattr(exc, 'sqlite_errorcode', None),\n                 'name': getattr(exc, 'sqlite_errorname', None), 'message': str(exc)}\n        raise\n    finally:\n        records.append({'statement': label, 'started': started,\n                        'seconds': time.perf_counter() - started, 'error': error})\n\n\nclass MeasuredConnection(sqlite3.Connection):\n    def execute(self, sql, *args, **kwargs):\n        return measured(' '.join(sql.split()), super().execute, sql, *args, **kwargs)\n\n    def executemany(self, sql, *args, **kwargs):\n        return measured(' '.join(sql.split()), super().executemany, sql, *args, **kwargs)\n\n    def commit(self):\n        return measured('COMMIT', super().commit)\n\n    def rollback(self):\n        return measured('ROLLBACK', super().rollback)\n\n\ndef measured_connect(*args, **kwargs):\n    return measured('CONNECT', connect, *args, factory=MeasuredConnection, **kwargs)\n\n\nsqlite3.connect = measured_connect\ntry:\n    telemetry.record_events([telemetry.make_event(\n        event_kind='page_read', query=None, retrieval_mode='direct',\n        candidate_id='page-' + sys.argv[2], rank=None, generation='legacy',\n        source_tool='writer')], db_path=Path(sys.argv[1]))\nfinally:\n    Path(sys.argv[3]).write_text(json.dumps({'writer': sys.argv[2], 'sqlite': sqlite3.sqlite_version,\n                                           'python': sys.version, 'records': records}, indent=2))\n")
          database = output / 'state/cache/evidence-graph/telemetry.sqlite3'
          env = dict(os.environ, PYTHONPATH=str(root / 'scripts'))
          with ExitStack() as stack:
              streams = [stack.enter_context((output / f'writer-{i}.err').open('w')) for i in range(8)]
              processes = [subprocess.Popen([sys.executable, str(child), str(database), str(i),
                                            str(output / f'writer-{i}.json')], env=env,
                                           stdout=streams[i], stderr=streams[i]) for i in range(8)]
              codes = [process.wait(timeout=SHORT_TIMEOUT) for process in processes]
          count = len(read_events(limit=8, db_path=database))
          print(json.dumps({'python': sys.version, 'sqlite': sqlite3.sqlite_version, 'codes': codes, 'events': count}))
          for path in sorted(output.glob('writer-*.json')):
              print(path.name, path.read_text())
          assert codes == [0] * 8
          assert count == 8
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sqlite-writer-diagnostic
          path: ${{ runner.temp }}/sqlite-diagnostic/
