# Language tier configuration for code_graph.py
# Each language: extension → {tier, grammar, query_file}

[python]
extension = ".py"
tier = "full"
query = "queries/python.scm"

[javascript]
extension = ".js"
tier = "full"
query = "queries/javascript.scm"

[typescript]
extension = ".ts"
tier = "full"
query = "queries/typescript.scm"

[typescript_tsx]
extension = ".tsx"
tier = "full"
query = "queries/typescript.scm"

[javascript_jsx]
extension = ".jsx"
tier = "full"
query = "queries/javascript.scm"

