  '''(?m)^        "disposition_key": "b535265409153a1fae12ba087323f27d71ce2574d2e00b8f82dcc29795ab845e",$''',
  '''(?m)^        "package_key": "b535265409153a1fae12ba087323f27d71ce2574d2e00b8f82dcc29795ab845e",$''',
  '''(?m)^        "purge_token": "c4d7c3eef524e4c3dac3e0b5523372e9c66f296ad184f37bd5f8e1a0ac5d4793",$''',
  '''(?m)^        "task_fence_token_digest": "fd137c7b81f93daf7ec0977eef25f2bbaed5bcc6be09074adfe7e81494cd0c23",$''',
  '''(?m)^      "disposition_key": "33a984e07d4fbfb84f580d85a707d4d32c6385201951cf42ebf707dbe1709c06"$''',
