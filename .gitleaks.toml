title = "LLM Wiki Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic SHA-256 fields in the Reliability v3 JSON fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^docs/superpowers/plans/2026-08-05-v4-reliability-queue\.md$''',
  '''^tests/test_reliable_memory_schemas\.py$''',
]
regexes = ['''^\s+"(?:action_key|package_key)": "[0-9a-f]{64}",$''']

[[allowlists]]
description = "Synthetic PEM body used only by the maintenance redaction regression"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = ['''^tests/test_maintenance_helpers\.py$''']
regexes = ['''c2VjcmV0LWtleS1tYXRlcmlhbA==''']

[[allowlists]]
description = "Pinned analyzer revisions that resemble Sourcegraph tokens"
condition = "AND"
targetRules = ["sourcegraph-access-token"]
regexTarget = "match"
paths = ['''^docs/superpowers/specs/2026-07-21-persistent-code-intelligence-kernel-design\.md$''']
regexes = [
  '''cac0779549328e4bd4b808000c03307f1721f869`''',
  '''71a5b117ec4c5dd2af302e363410e604e5df309e`''',
]

[[allowlists]]
description = "Public jwt.io example used by the secret-redaction regression test"
condition = "AND"
targetRules = ["jwt"]
regexTarget = "line"
paths = ['''^tests/test_security_invariants\.py$''']
regexes = ['''^\s+jwt = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUPCTHLak8"$''']

[[allowlists]]
description = "Synthetic credential used only by the JSON secret-redaction regression and its research note"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^tests/test_a_secret_in_json_is_still_a_secret\.py$''',
  '''^docs/research/2026-09-25-a-secret-in-json-is-still-a-secret\.md$''',
]
regexes = ['''a8f3k29dkq84mzp1x''']

[[allowlists]]
description = "Synthetic Google token used only by the redactor regression for missing shapes"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
paths = ['''^tests/test_the_redactor_knows_the_missing_shapes\.py$''']
regexes = ['''ya29\.a0AfH6SMBxQwErTy12345''']

[[allowlists]]
description = "Synthetic key for failed-server stderr redaction"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^tests/test_a_failed_server_leaves_its_redacted_last_words\.py$''']
regexes = ['''(?m)^API_KEY = "0123456789abcdef0123"$''']

[[allowlists]]
description = "Synthetic unprefixed key for credential-assignment redaction"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^tests/test_secret_redact\.py$''']
regexes = ['''(?m)^_UNPREFIXED_SECRET = "Zx8Qw2Lp5Rt9Yv3Nb6Mk1Hj4Gd7Fs0A"$''']

[[allowlists]]
description = "Public pinned multilingual-e5-small model revision"
condition = "AND"
targetRules = ["sourcegraph-access-token"]
regexTarget = "line"
paths = ['''^docs/research/2026-08-28-what-a-rebuild-may-reuse\.md$''']
regexes = ['''(?m)^- `model_revision` is equal \(`614241f622f53c4eeff9890bdc4f31cfecc418b3`\)\.$''']

[[allowlists]]
description = "Exact synthetic curl credentials in command-context redaction regressions"
condition = "AND"
targetRules = ["curl-auth-user"]
regexTarget = "line"
paths = ['''^tests/test_a_user_flag_belongs_to_its_command\.py$''']
regexes = [
  '''(?m)^    "curl -u user:privatepw https://example\.test",$''',
  '''(?m)^    "curl --user=user:privatepw https://example\.test",$''',
  '''(?m)^    'curl -u "user:privatepw with spaces" https://example\.test',$''',
  '''(?m)^    "curl -u 'user:privatepw with spaces' https://example\.test",$''',
  '''(?m)^    "date -u \+%H:%M:%S; curl -u user:privatepw https://example\.test",$''',
  '''(?m)^    "curl -H 'X-Example: one;two' -u user:privatepw https://example\.test",$''',
  '''(?m)^    "bash -c 'curl -u user:privatepw https://example\.test'",$''',
  '''(?m)^    "/usr/bin/curl -u user:privatepw https://example\.test",$''',
  '''(?m)^    '"/usr/bin/curl" \-u user:privatepw https://example\.test',$''',
  '''(?m)^    "curl \\\\\\n  \-u user:privatepw https://example\.test",$''',
  '''(?m)^    "curl `\\n  \-u user:privatepw https://example\.test",$''',
]
